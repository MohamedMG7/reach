<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <style>
      /*XTERM_CSS*/
      html, body, #terminal { margin: 0; padding: 0; width: 100%; height: 100%; background: #0B0C10; overflow: hidden; }
      #terminal { box-sizing: border-box; padding: 6px 8px; }
    </style>
    <script>/*XTERM_JS*/</script>
    <script>/*FIT_JS*/</script>
  </head>
  <body>
    <div id="terminal"></div>
    <script>
      (function () {
        // Bridge to the app (spec §6.4): the page posts {type:'size'|'input'} as JSON and the app
        // calls window.reach.write / reset / focus through injectJavaScript.
        var post = function (message) { window.ReactNativeWebView.postMessage(JSON.stringify(message)); };
        var term = new Terminal({ fontSize: 13, fontFamily: 'Menlo, monospace', cursorBlink: true, scrollback: 5000,
          theme: { background: '#0B0C10', foreground: '#E6E9EF', cursor: '#4F7CFF', cursorAccent: '#0B0C10', selectionBackground: 'rgba(79,124,255,0.35)' } });
        var fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(document.getElementById('terminal'));
        var last = '';
        var refit = function () {
          fit.fit();
          var size = term.cols + 'x' + term.rows;
          if (size === last) return;
          last = size;
          post({ type: 'size', cols: term.cols, rows: term.rows });
        };
        term.onData(function (data) { post({ type: 'input', data: data }); });
        new ResizeObserver(refit).observe(document.getElementById('terminal'));
        window.reach = {
          write: function (data) { term.write(data); },
          reset: function () { term.reset(); },
          focus: function () { term.focus(); },
          blur: function () { term.blur(); },
        };
        refit();
      })();
    </script>
  </body>
</html>
